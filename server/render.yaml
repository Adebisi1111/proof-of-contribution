services:
  - type: web
    name: proof-of-contribution-relay
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: node index.js
    healthCheckPath: /api/health
    envVars:
      - key: DEPLOY_PK
        sync: false
      - key: CONTRACT_ADDRESS
        value: 0x218E6256B0ED02F0Bb5155E5Ae93219168c4c32f
      - key: PORT
        value: 10000
